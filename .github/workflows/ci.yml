name: CI

on:
  # Every pushed branch, not only main: work is pushed straight to branches, so a push is how CI
  # sees it. Pull requests are checked too.
  push:
  pull_request:

# Read-only, and no secrets anywhere: CI can neither change the repository nor deploy.
permissions:
  contents: read

# Actions are pinned to a commit, not a tag: a tag can be moved to other code, a commit can't.
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      LOG_TO_FILES: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: No secrets in the tree
        run: python scripts/scan_secrets.py
      # LibreOffice as in the Dockerfile (less the CJK fonts), so the office tests run too.
      - run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libarchive-tools
          libreoffice-impress-nogui libreoffice-writer-nogui libreoffice-calc-nogui
          fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation2 fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: python -m pyflakes main.py bots shared scripts tests
      - name: Every bot loads
        run: python main.py --check
      - name: Tests
        run: pytest -q tests

  # Known vulnerabilities in the dependencies as they would be installed today. Its own job,
  # so a new advisory shows up as a red mark here without hiding whether the tests pass.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - name: Known vulnerabilities
        run: pip-audit -r requirements.txt --progress-spinner off

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Build the image (runs main.py --check inside)
        run: docker build -t mumubots .
