# Runs the edition's own self-check on every push: every bot loads, every section
# parses on Python 3.11 (the image's version), and one real conversion runs in the
# worker process -- the same `python main.py --check` the Dockerfile runs, so an
# image that cannot load a bot never gets as far as a deploy, and a push that
# would produce one is red here first.
#
# No secrets, no tokens and no database: the check needs none, read-only
# permissions, nothing is deployed from here. Railway builds from `main`
# on its own; this does not gate it.
#
# Written 2026-10-07 for MumuCombined; runs on MumuBots since 2.1.7.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: ffmpeg, bsdtar, the text-recognition language data and LibreOffice
        # The same packages as the Dockerfile (less the CJK fonts), so the self-check also reads a
        # test page's text and turns a PDF into slides and back.
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libarchive-tools
          tesseract-ocr-eng tesseract-ocr-rus tesseract-ocr-uzb tesseract-ocr-uzb-cyrl
          libreoffice-impress-nogui libreoffice-writer-nogui libreoffice-calc-nogui
          fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation2 fonts-dejavu-core
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Self-check
        env:
          PYTHONIOENCODING: utf-8
          TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
          MUMU_CHECK_OFFICE: "1"
        run: python main.py --check
