# Runs the whole offline suite on every push and pull request.
#
# `python tests/run.py` needs no database, no network and no tokens: the
# libraries it does not have are stubbed, and the ones it can use (Pillow,
# PyMuPDF, ffmpeg, and bsdtar from libarchive-tools, as in convert_bot/Dockerfile,
# which the 7z and RAR archive tests need) are installed here so those checks
# run instead of skipping.
# Nothing in this workflow can see a secret, deploys nothing, and cannot change
# the repository: read-only permissions, no `secrets.` anywhere.
#
# Written 2026-10-07 and NOT yet run on GitHub: the suite had only ever been run
# on Windows. If the first run is red, read it before trusting either side --
# the cause may be a Windows assumption in a test rather than a bug in a bot.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]      # the image builds on 3.11; 3.12 is what the owner's laptop runs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: ffmpeg and bsdtar
        # libarchive-tools is what puts `bsdtar` on the PATH; without it the 7z and
        # RAR checks in tests/test_archives.py skip, and a skip is a green nobody read.
        # The tesseract-ocr-* language data is convert_bot/Dockerfile's too: with it
        # tests/test_ocr.py reads real text instead of skipping.
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libarchive-tools
          tesseract-ocr-eng tesseract-ocr-rus tesseract-ocr-uzb tesseract-ocr-uzb-cyrl
      - name: Install every bot's requirements
        run: |
          python -m pip install --upgrade pip
          for f in sticker_bot convert_bot downloader_bot anon_bot manager_bot; do
            pip install -r "$f/requirements.txt"
          done
      - name: Offline suite
        env:
          # A throwaway identity for the tests that commit to temporary repositories.
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.invalid
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.invalid
          PYTHONIOENCODING: utf-8
          TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
        run: python tests/run.py
